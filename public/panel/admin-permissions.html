<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Uprawnienia pracowników | QualitetMarket</title>
  <script src="/js/admin-common.js"></script>
  <script>
    if (!window.QMAdminPanel || !window.QMAdminPanel.requireLogin('/panel/login-admin.html')) {
      document.documentElement.classList.add('is-redirecting');
    }
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #020617;
      --panel: rgba(15, 23, 42, 0.9);
      --border: rgba(148, 163, 184, 0.2);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --qm-accent: #7c3aed;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #020617, #111827);
    }
    .shell {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 42px;
    }
    .card {
      margin-bottom: 20px;
      padding: 24px;
      border-radius: 24px;
      border: 1px solid var(--border);
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(2, 6, 23, 0.35);
    }
    select,
    input[type="checkbox"] {
      accent-color: var(--qm-accent);
    }
    select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.76);
      color: var(--text);
      font: inherit;
      margin-top: 16px;
    }
    .permissions-grid {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }
    .permission-row {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.7);
    }
    .nav,
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    button,
    a {
      border: 0;
      border-radius: 14px;
      padding: 12px 16px;
      font: inherit;
      cursor: pointer;
      text-decoration: none;
    }
    .primary {
      background: linear-gradient(135deg, var(--qm-accent), #2563eb);
      color: white;
    }
    .secondary {
      background: rgba(148, 163, 184, 0.14);
      color: var(--text);
    }
    p {
      color: var(--muted);
      line-height: 1.5;
    }
    .message {
      min-height: 20px;
      color: #a7f3d0;
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card nav">
      <a class="secondary" href="/panel/admin-panel.html">← Panel szefa</a>
      <a class="secondary" href="/panel/admin-settings.html">Ustawienia</a>
      <a class="secondary" href="/panel/admin-users.html">Pracownicy</a>
    </section>

    <section class="card">
      <h1>Panel uprawnień</h1>
      <p>Uprawnienia zapisują się w <code>localStorage</code> i wpływają na dostęp do sekcji w panelu szefa podczas podglądu pracowników.</p>

      <label>
        Wybierz pracownika
        <select id="qm-permissions-worker-select"></select>
      </label>

      <div class="permissions-grid" id="qm-permissions-grid"></div>

      <div class="actions" style="margin-top:18px">
        <button class="primary" type="button" id="qm-save-permissions">Zapisz uprawnienia</button>
      </div>
      <p class="message" id="qm-permissions-message" aria-live="polite"></p>
    </section>
  </main>

  <script>
    (function () {
      const admin = window.QMAdminPanel
      const params = new URLSearchParams(window.location.search)
      const workerSelect = document.getElementById('qm-permissions-worker-select')
      const permissionsGrid = document.getElementById('qm-permissions-grid')
      const message = document.getElementById('qm-permissions-message')
      const saveButton = document.getElementById('qm-save-permissions')

      admin.applyPreferences()

      function renderWorkerOptions() {
        const workers = admin.getWorkers()
        if (!workers.length) {
          workerSelect.innerHTML = '<option value="">Brak pracowników do konfiguracji</option>'
          permissionsGrid.innerHTML = '<p>Dodaj pracownika w panelu pracowników, aby nadać mu uprawnienia.</p>'
          saveButton.disabled = true
          return
        }

        workerSelect.innerHTML = workers.map(function (worker) {
          return '<option value="' + worker.id + '">' + worker.name + '</option>'
        }).join('')

        const requestedWorkerId = params.get('workerId')
        if (requestedWorkerId && admin.getWorker(requestedWorkerId)) {
          workerSelect.value = requestedWorkerId
        }
        saveButton.disabled = false
      }

      function renderPermissionCheckboxes() {
        const worker = admin.getWorker(workerSelect.value)
        if (!worker) {
          permissionsGrid.innerHTML = '<p>Wybierz pracownika.</p>'
          return
        }

        permissionsGrid.innerHTML = admin.PERMISSIONS.map(function (permission) {
          const checked = worker.permissions.includes(permission.key) ? 'checked' : ''
          return '' +
            '<label class="permission-row">' +
              '<input type="checkbox" data-permission-key="' + permission.key + '" ' + checked + '>' +
              '<span>' + permission.label + '</span>' +
            '</label>'
        }).join('')
      }

      saveButton.addEventListener('click', function () {
        const worker = admin.getWorker(workerSelect.value)
        if (!worker) {
          message.textContent = 'Najpierw wybierz pracownika.'
          return
        }
        const permissions = Array.from(permissionsGrid.querySelectorAll('[data-permission-key]:checked')).map(function (input) {
          return input.dataset.permissionKey
        })
        admin.updateWorkerPermissions(worker.id, permissions)
        message.textContent = 'Uprawnienia zostały zapisane.'
        renderPermissionCheckboxes()
      })

      workerSelect.addEventListener('change', renderPermissionCheckboxes)

      renderWorkerOptions()
      renderPermissionCheckboxes()
    }())
  </script>
</body>
</html>
