<section class="qm-tasks-panel" id="qm-tasks-panel">
  <style>
    .qm-tasks-panel {
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 24px;
      padding: 24px;
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 24px 80px rgba(2, 6, 23, 0.35);
      color: #e2e8f0;
      font-family: Inter, Arial, sans-serif;
    }
    .qm-tasks-panel[hidden] {
      display: none !important;
    }
    .qm-tasks-panel h2 {
      margin: 0 0 8px;
      font-size: 1.5rem;
    }
    .qm-tasks-panel p {
      margin: 0 0 20px;
      color: #94a3b8;
      line-height: 1.5;
    }
    .qm-tasks-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 12px;
    }
    .qm-tasks-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.16);
      background: rgba(15, 23, 42, 0.72);
    }
    .qm-tasks-item input {
      width: 18px;
      height: 18px;
      accent-color: #7c3aed;
      flex: 0 0 auto;
    }
    .qm-tasks-item span {
      line-height: 1.4;
    }
    .qm-tasks-footer {
      margin-top: 18px;
      color: #94a3b8;
      font-size: 0.92rem;
    }
  </style>

  <h2>Lista zadań QM</h2>
  <p>Zaznacz kolejne kroki aktywacji sklepu. Po ukończeniu wszystkich moduł ukryje się automatycznie.</p>

  <ul class="qm-tasks-list" id="qm-tasks-list">
    <li class="qm-tasks-item">
      <input type="checkbox" id="qm-task-login" data-task-id="login_to_panel">
      <label for="qm-task-login"><span>Logowanie do panelu</span></label>
    </li>
    <li class="qm-tasks-item">
      <input type="checkbox" id="qm-task-stripe" data-task-id="connect_stripe">
      <label for="qm-task-stripe"><span>Podłączenie Stripe</span></label>
    </li>
    <li class="qm-tasks-item">
      <input type="checkbox" id="qm-task-supplier" data-task-id="connect_supplier">
      <label for="qm-task-supplier"><span>Podłączenie hurtowni dropshipping</span></label>
    </li>
    <li class="qm-tasks-item">
      <input type="checkbox" id="qm-task-import" data-task-id="import_products">
      <label for="qm-task-import"><span>Pobranie produktów z hurtowni</span></label>
    </li>
    <li class="qm-tasks-item">
      <input type="checkbox" id="qm-task-store" data-task-id="generate_store_and_margin">
      <label for="qm-task-store"><span>Wygenerowanie sklepu i ustawienie marży</span></label>
    </li>
    <li class="qm-tasks-item">
      <input type="checkbox" id="qm-task-products" data-task-id="add_products_to_store">
      <label for="qm-task-products"><span>Dodanie produktów do sklepu</span></label>
    </li>
    <li class="qm-tasks-item">
      <input type="checkbox" id="qm-task-payment" data-task-id="test_payment">
      <label for="qm-task-payment"><span>Wykonanie testowej płatności</span></label>
    </li>
    <li class="qm-tasks-item">
      <input type="checkbox" id="qm-task-forwarding" data-task-id="automatic_order_forwarding">
      <label for="qm-task-forwarding"><span>Konfiguracja automatycznych zamówień</span></label>
    </li>
    <li class="qm-tasks-item">
      <input type="checkbox" id="qm-task-marketing" data-task-id="launch_marketing">
      <label for="qm-task-marketing"><span>Uruchomienie sprzedaży/marketingu</span></label>
    </li>
  </ul>

  <div class="qm-tasks-footer" id="qm-tasks-footer">Postęp zapisuje się automatycznie w localStorage.</div>
</section>

<script>
  (function () {
    const panel = document.getElementById('qm-tasks-panel');
    if (!panel || panel.dataset.initialized === 'true') {
      return;
    }

    panel.dataset.initialized = 'true';

    const PROGRESS_KEY = 'qm_tasks_progress';
    const DONE_KEY = 'qm_tasks_done';
    const checkboxes = Array.from(panel.querySelectorAll('[data-task-id]'));
    const footer = document.getElementById('qm-tasks-footer');

    function readProgress() {
      try {
        const raw = localStorage.getItem(PROGRESS_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (error) {
        return {};
      }
    }

    function writeProgress(progress) {
      localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
    }

    function dispatchUpdate() {
      window.dispatchEvent(new Event('qm:tasks-updated'));
    }

    function applyVisibility(allDone) {
      if (allDone) {
        localStorage.setItem(DONE_KEY, 'true');
        footer.textContent = 'Wszystkie zadania ukończone. Moduł został ukryty.';
        panel.hidden = true;
        panel.style.display = 'none';
      } else {
        localStorage.removeItem(DONE_KEY);
        footer.textContent = 'Postęp zapisuje się automatycznie w localStorage.';
        panel.hidden = false;
        panel.style.display = '';
      }
      dispatchUpdate();
    }

    function syncFromStorage() {
      const progress = readProgress();

      if (localStorage.getItem('qm_admin_logged') === 'true') {
        progress.login_to_panel = true;
      }

      checkboxes.forEach(function (checkbox) {
        checkbox.checked = Boolean(progress[checkbox.dataset.taskId]);
      });

      writeProgress(progress);
      const allDone = checkboxes.every(function (checkbox) {
        return checkbox.checked;
      });
      applyVisibility(allDone);
    }

    checkboxes.forEach(function (checkbox) {
      checkbox.addEventListener('change', function () {
        const progress = readProgress();
        progress[checkbox.dataset.taskId] = checkbox.checked;
        writeProgress(progress);
        const allDone = checkboxes.every(function (item) {
          return item.checked;
        });
        applyVisibility(allDone);
      });
    });

    syncFromStorage();
  }());
</script>
