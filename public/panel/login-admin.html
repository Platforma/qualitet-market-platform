<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Logowanie administratora | QualitetMarket</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --card: rgba(15, 23, 42, 0.92);
      --border: rgba(148, 163, 184, 0.22);
      --accent: #7c3aed;
      --accent-2: #22c55e;
      --text: #e5eefb;
      --muted: #94a3b8;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, Arial, sans-serif;
      background:
        radial-gradient(circle at top, rgba(124, 58, 237, 0.24), transparent 30%),
        linear-gradient(180deg, #020617, var(--bg));
      color: var(--text);
    }
    .login-card {
      width: min(100%, 420px);
      padding: 32px;
      border-radius: 24px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: 0 24px 80px rgba(2, 6, 23, 0.5);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
    }
    p {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.5;
    }
    form {
      display: grid;
      gap: 16px;
    }
    label {
      display: grid;
      gap: 8px;
      font-size: 0.95rem;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.88);
      color: var(--text);
      font: inherit;
    }
    button {
      border: 0;
      border-radius: 14px;
      padding: 14px 18px;
      background: linear-gradient(135deg, var(--accent), #2563eb);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .login-hint {
      margin-top: 18px;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .login-message {
      min-height: 20px;
      margin: 0;
      font-size: 0.92rem;
      color: var(--danger);
    }
    .login-message.is-success {
      color: var(--accent-2);
    }
  </style>
  <script>
    if (localStorage.getItem('qm_admin_logged') === 'true') {
      window.location.replace('/public/panel/dashboard.html');
    }
  </script>
</head>
<body>
  <main class="login-card">
    <h1>Panel administratora</h1>
    <p>Zaloguj się jako szef, aby przejść do dashboardu i dokończyć konfigurację sklepu.</p>

    <form id="qm-admin-login-form">
      <label>
        Login
        <input type="text" name="login" autocomplete="username" required>
      </label>

      <label>
        Hasło
        <input type="password" name="password" autocomplete="current-password" required>
      </label>

      <p class="login-message" id="qm-admin-login-message" aria-live="polite"></p>
      <button type="submit">Zaloguj</button>
    </form>

    <div class="login-hint">Dostęp lokalny zapisuje stan w <code>localStorage.qm_admin_logged</code>.</div>
  </main>

  <script>
    (function () {
      const form = document.getElementById('qm-admin-login-form');
      const message = document.getElementById('qm-admin-login-message');

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        const data = new FormData(form);
        const login = String(data.get('login') || '').trim();
        const password = String(data.get('password') || '');

        if (login === 'szef' && password === 'admin') {
          localStorage.setItem('qm_admin_logged', 'true');
          message.textContent = 'Logowanie zakończone powodzeniem.';
          message.classList.add('is-success');
          window.location.replace('/public/panel/dashboard.html');
          return;
        }

        message.textContent = 'Niepoprawne dane logowania';
        message.classList.remove('is-success');
      });
    }());
  </script>
</body>
</html>
