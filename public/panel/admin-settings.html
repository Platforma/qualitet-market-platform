<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ustawienia szefa | QualitetMarket</title>
  <script src="/public/panel/admin-common.js"></script>
  <script>
    if (!window.QMAdminPanel || !window.QMAdminPanel.requireLogin('/public/panel/login-admin.html')) {
      document.documentElement.classList.add('is-redirecting');
    }
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #020617;
      --panel: rgba(15, 23, 42, 0.9);
      --border: rgba(148, 163, 184, 0.2);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --qm-accent: #7c3aed;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #020617, #111827);
    }
    .shell {
      width: min(860px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 42px;
    }
    .card {
      margin-bottom: 20px;
      padding: 24px;
      border-radius: 24px;
      border: 1px solid var(--border);
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(2, 6, 23, 0.35);
    }
    form {
      display: grid;
      gap: 16px;
      margin-top: 18px;
    }
    label {
      display: grid;
      gap: 8px;
    }
    input, select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.76);
      color: var(--text);
      font: inherit;
    }
    .checkbox-row {
      display: flex;
      gap: 10px;
      align-items: center;
      color: var(--muted);
    }
    .actions,
    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    button,
    .nav a {
      border: 0;
      border-radius: 14px;
      padding: 12px 16px;
      font: inherit;
      cursor: pointer;
      text-decoration: none;
      color: white;
      background: linear-gradient(135deg, var(--qm-accent), #2563eb);
    }
    .nav a.secondary,
    button.secondary {
      background: rgba(148, 163, 184, 0.14);
      color: var(--text);
    }
    .message {
      min-height: 20px;
      color: #a7f3d0;
    }
    p {
      color: var(--muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card nav">
      <a href="/public/panel/admin-panel.html">← Panel szefa</a>
      <a class="secondary" href="/public/panel/admin-users.html">Pracownicy</a>
      <a class="secondary" href="/public/panel/admin-permissions.html">Uprawnienia</a>
    </section>

    <section class="card">
      <h1>Ustawienia szefa</h1>
      <p>Zmieniaj lokalny login i hasło, zapisuj preferencje panelu oraz zarządzaj sesją właściciela.</p>

      <form id="qm-admin-credentials-form">
        <label>
          Login szefa
          <input type="text" name="login" id="qm-admin-login-input" required>
        </label>
        <label>
          Hasło szefa
          <input type="password" name="password" id="qm-admin-password-input" required>
        </label>
        <div class="actions">
          <button type="submit">Zapisz dane logowania</button>
        </div>
      </form>
      <p class="message" id="qm-admin-credentials-message" aria-live="polite"></p>
    </section>

    <section class="card">
      <h2>Preferencje panelu</h2>
      <form id="qm-admin-preferences-form">
        <label>
          Akcent panelu
          <select name="accent" id="qm-admin-accent-select">
            <option value="violet">Violet</option>
            <option value="emerald">Emerald</option>
            <option value="amber">Amber</option>
          </select>
        </label>
        <label class="checkbox-row">
          <input type="checkbox" name="compactMode" id="qm-admin-compact-mode">
          Tryb kompaktowy panelu
        </label>
        <label class="checkbox-row">
          <input type="checkbox" name="showSalesStats" id="qm-admin-show-sales-stats">
          Pokazuj sekcję statystyk sprzedaży
        </label>
        <div class="actions">
          <button type="submit">Zapisz preferencje</button>
        </div>
      </form>
      <p class="message" id="qm-admin-preferences-message" aria-live="polite"></p>
    </section>

    <section class="card">
      <h2>Sesja szefa</h2>
      <p>Wylogowanie usuwa tylko stan <code>qm_admin_logged</code>, pozostawiając zapisane ustawienia lokalne.</p>
      <div class="actions">
        <button class="secondary" type="button" id="qm-admin-logout">Wyloguj</button>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const admin = window.QMAdminPanel
      const credentials = admin.getCredentials()
      const preferences = admin.applyPreferences()
      const credentialsForm = document.getElementById('qm-admin-credentials-form')
      const preferencesForm = document.getElementById('qm-admin-preferences-form')
      const credentialsMessage = document.getElementById('qm-admin-credentials-message')
      const preferencesMessage = document.getElementById('qm-admin-preferences-message')

      document.getElementById('qm-admin-login-input').value = credentials.login
      document.getElementById('qm-admin-password-input').value = credentials.password
      document.getElementById('qm-admin-accent-select').value = preferences.accent
      document.getElementById('qm-admin-compact-mode').checked = Boolean(preferences.compactMode)
      document.getElementById('qm-admin-show-sales-stats').checked = Boolean(preferences.showSalesStats)

      credentialsForm.addEventListener('submit', function (event) {
        event.preventDefault()
        const data = new FormData(credentialsForm)
        const loginValue = String(data.get('login') || '').trim()
        const passwordValue = String(data.get('password') || '')

        if (!loginValue || !passwordValue) {
          credentialsMessage.textContent = 'Login i hasło nie mogą być puste.'
          return
        }

        admin.updateCredentials(loginValue, passwordValue)
        credentialsMessage.textContent = 'Dane logowania szefa zostały zapisane lokalnie.'
      })

      preferencesForm.addEventListener('submit', function (event) {
        event.preventDefault()
        const data = new FormData(preferencesForm)
        admin.savePreferences({
          accent: String(data.get('accent') || 'violet'),
          compactMode: data.get('compactMode') === 'on',
          showSalesStats: data.get('showSalesStats') === 'on'
        })
        admin.applyPreferences()
        preferencesMessage.textContent = 'Preferencje panelu zostały zapisane.'
      })

      document.getElementById('qm-admin-logout').addEventListener('click', function () {
        admin.logout('/public/panel/login-admin.html')
      })
    }())
  </script>
</body>
</html>
